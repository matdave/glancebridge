; Glance Clock ESP32 bridge
; NimBLE-Arduino 2.x requires arduino-esp32 3.x (ESP-IDF 5) -> pioarduino platform
[platformio]
default_envs = adafruit_feather_esp32_v2

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -Wall
    -Wextra
    ; surface NimBLE's own error logs (e.g. "writeValue failed, rc: ...")
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
lib_deps =
    fbiego/ChronosESP32@^1.9.1
    h2zero/NimBLE-Arduino@^2.5.1
    nanopb/Nanopb@^0.4.92
    bblanchon/ArduinoJson@^7.4.2

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32c3]
board = esp32-c3-devkitm-1

; classic ESP32 (Adafruit Feather ESP32 V2, 8MB flash)
; custom board def without the PSRAM cache-workaround codegen flags: the
; bridge never touches PSRAM, and with WiFi + NimBLE the flags overflow IRAM
[env:adafruit_feather_esp32_v2]
board = glance_feather_esp32_v2
board_build.partitions = default_8MB.csv

; host-side protocol unit tests (pio test -e native)
[env:native]
platform = native
; unset the arduino framework inherited from [env]
framework =
build_flags =
    -std=c++17
    -Wall
    -Wextra
lib_deps =
    nanopb/Nanopb@^0.4.92

